<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="vig"></div>
  <div id="glow"></div>
  <div id="labels"></div>
  <div id="hud" hidden>
    <div class="hrow">
      <div class="plaque"><span class="cap">STAGE</span><b id="hStage">1</b><span id="hGuests" class="sub">2名様</span></div>
      <div class="right"><div id="hLives" class="plaque lives" role="img" aria-label="ライフ"></div></div>
    </div>
    <div id="hInfo" class="info"></div>
    <div id="hDots" class="dots"></div>
    <div class="spacer"></div>
    <div id="hHint" class="hint"></div>
  </div>
  <button id="btnSound" class="iconbtn" aria-label="音を切りかえる" aria-pressed="true">♪</button>

  <section id="title" class="screen">
    <div class="tt">
      <p class="eyebrow">the art of the equal pour</p>
      <h1>Pourfect <i>Sommelier</i></h1>
      <p class="lead">ボトルのワインを、人数分ぴったりに注ぎ分けよう。</p>
      <ol class="how">
        <li><b>下へなぞる</b>と注ぐ</li>
        <li><b>指を離す</b>と次のグラスへ</li>
        <li>最後の 1 杯には<b>残りがぜんぶ</b>入る</li>
        <li>外すと<b>ライフ</b>が 1 つ減る。全員ぴったりで 1 つ戻る</li>
      </ol>
      <button id="btnStart" class="btn">はじめる</button>
      <p id="tBest" class="best"></p>
    </div>
  </section>

  <section id="intro" class="card" hidden>
    <h2 id="iGuests">2名様のご来店</h2>
    <p id="iHint" class="note"></p>
    <button id="btnGo" class="btn">注ぎはじめる</button>
  </section>

  <section id="result" class="card" hidden>
    <p class="cap" id="rStage"></p>
    <h2 id="rTitle"></h2>
    <div class="fold"><div><p id="rSub" class="sub"></p></div></div>
    <div id="rBars" class="bars"></div>
    <div id="rLegend" class="legend"></div>
    <div class="fold"><div>
      <div id="rLine" class="scoreline"><span id="rLeft"></span><span id="rRight"></span></div>
      <div class="btns">
        <button id="btnNext" class="btn">次のお客様へ</button>
        <button id="btnRetry" class="btn" hidden>STAGE 1 からもう一度</button>
        <button id="btnTitle" class="btn ghost" hidden>タイトルへ</button>
      </div>
    </div></div>
  </section>
  <pre id="dbg" hidden></pre>
</div>
